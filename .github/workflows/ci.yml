# PR のたびに（と、main に入ったあとにも）、テストと静的チェックを自動で走らせる。
# 手元でやっている確認（CLAUDE.md の 5「開発のコマンド」）と、同じものを、GitHub の上で行う。
#   backend  : pytest（MySQL を、CI の中で起動する）、ruff check、ruff format --check
#   frontend : lint、format:check、test、build
#   terraform: fmt、validate、tflint、trivy（AWS の構成のコードの点検。AWS には、つながない）
# 使う部品（uses）は、版の名前ではなく、コミットの ID で固定している（後ろのコメントが、版の名前）。
# 差し替えられた部品を、知らずに使ってしまうのを防ぐため。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 読むだけの権限にする（書き込みや、秘密情報は使わない）
permissions:
  contents: read

# 同じ PR に続けて push したときは、古い実行を止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 実行環境（OS）は、Ubuntu 24.04 に固定している。ubuntu-latest は、気づかないうちに新しい版に切り替わり、
# CI が失敗することがあるため。上げるときは、確かめてから、ここを書き換える。
# ジョブの name を変えると、「必須チェック」の設定（GitHub 側）が、見つからない状態になる。変えるときは、設定も直す。

jobs:
  backend:
    name: backend（pytest・ruff）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # アプリとテストが読む設定（ふだんは、リポジトリ直下の .env にある）。CI には .env がないので、ここで渡す。
      # テストが使う DB は、テストの中で作って、終わると消す使い捨て。値は、CI 専用のダミーでよい（本物の秘密ではない）
      MYSQL_ROOT_PASSWORD: ci-dummy-root-password
      MYSQL_DATABASE: biz_request_tracker
      MYSQL_USER: biz_user
      MYSQL_PASSWORD: ci-dummy-password
      MYSQL_PORT: '3306'
    services:
      # テスト用の MySQL。手元の docker-compose.yml と同じ版（8.4）。この CI の中だけで動き、終わると消える
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-dummy-root-password
        ports:
          - 3306:3306
        # MySQL が、つながる状態になるまで待つ（起動に、数十秒かかる）
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # 部品のキャッシュ（uv.lock が変わらなければ、次から速い）
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # uv.lock のとおりに入れる（lock とずれていたら失敗する）。Python の版は、.python-version（3.13）
      - run: uv sync --locked
      - run: uv run ruff check .
      # 整形が、そろっているか。ずれていたら、手元で uv run ruff format . を実行して直す
      - run: uv run ruff format --check .
      # テストと同時に、カバレッジ（どこまで通ったか）を測る。しきい値を下回ると、失敗する（backend/pyproject.toml）。
      # テストは1回だけ動かす（uv run pytest を、置き換えている）
      - run: uv run pytest --cov

  frontend:
    name: frontend（lint・test・build）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # package-lock.json のとおりに入れる（版が勝手に変わらない）
      - run: npm ci
      - run: npm run lint
      # 整形（Prettier）が、そろっているか。ずれていたら、手元で、触ったファイルを npx prettier --write で直す
      - run: npm run format:check
      # テストと同時に、カバレッジ（どこまで通ったか）を測る。しきい値を下回ると、失敗する（frontend/vite.config.ts）。
      # テストは1回だけ動かす（npm run test を、置き換えている）
      - run: npm run test:coverage
      - run: npm run build

  # Terraform（AWS の構成のコード）の点検。AWS には、つながない（秘密も認証情報も使わない。読むだけ）。
  # 道具は、使い捨ての Docker で動かす。版は、手元で確かめた物に固定している（勝手に変わって、CI が突然失敗しないように）。
  # 上げるときは、手元で動かして確かめてから、ここを書き換える。手元と同じ手順：docs/quality-review.md の 9 章
  terraform:
    name: terraform（fmt・validate・tflint・trivy）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: terraform
    env:
      TERRAFORM_IMAGE: hashicorp/terraform:1.16.6
      TFLINT_IMAGE: ghcr.io/terraform-linters/tflint:v0.65.0
      TRIVY_IMAGE: aquasec/trivy:0.76.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 整形が、そろっているか。ずれていたら、手元で、terraform fmt（.tf ファイルを指定）を実行して直す
      - name: terraform fmt
        run: docker run --rm -v "$PWD:/work" -w /work "$TERRAFORM_IMAGE" fmt -check -diff
      # 文法と、部品のつじつま（AWS には、つながない。部品の取得だけ、ネットに出る）
      - name: terraform validate
        run: >-
          docker run --rm -v "$PWD:/work" -w /work --entrypoint sh "$TERRAFORM_IMAGE"
          -c "terraform init -backend=false -input=false && terraform validate"
      # 書き方の点検（Terraform 自体と、AWS 用のルール。プラグインの版は .tflint.hcl で固定）
      - name: tflint
        run: >-
          docker run --rm -e GITHUB_TOKEN -v "$PWD:/work" -w /work --entrypoint sh "$TFLINT_IMAGE"
          -c "tflint --init && tflint"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # セキュリティの弱点の探索。「意図した設定」は .trivyignore に理由つきで書いてある。
      # スイッチ（create_database）が false のときは RDS を調べないので、true にした場合も、ダミーの値で調べる
      - name: trivy（create_database = false）
        run: >-
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE"
          config . --ignorefile /work/.trivyignore --exit-code 1
      - name: trivy（create_database = true。ダミーの値）
        run: |
          printf 'my_ip = "203.0.113.10/32"\ndb_password = "dummy-password-1234"\ncreate_database = true\n' > "$RUNNER_TEMP/dummy.tfvars"
          docker run --rm -v "$PWD:/work" -v "$RUNNER_TEMP/dummy.tfvars:/dummy.tfvars:ro" -w /work "$TRIVY_IMAGE" \
            config . --tf-vars /dummy.tfvars --ignorefile /work/.trivyignore --exit-code 1
