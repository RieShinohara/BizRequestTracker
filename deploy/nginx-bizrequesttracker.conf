# =============================================================
# nginx の設定：画面を配信し、/api と /health のお願いだけを、バックエンド（8000番）に中継する。
#   ブラウザから見ると、80番の1か所としか話さないので、CORS の設定は要らない。
#   バックエンドの 8000番は、サーバーの中（127.0.0.1）だけで使う。外には開けない。
#   API の説明画面（/docs、/redoc、/openapi.json）は、外に出さない（はっきり 404 にする）。
# 置き場所：EC2 の /etc/nginx/default.d/bizrequesttracker.conf
#   （nginx の標準の設定が、このフォルダの .conf を、80番のサーバーの中に読み込む）
# 画面のファイル（npm run build で作った dist の中身）は、/usr/share/nginx/html に置く
# =============================================================

# 動作確認用。サーバーが起きているかだけを返す（データは出ない）
location = /health {
    proxy_pass http://127.0.0.1:8000/health;
    proxy_set_header Host $host;
}

# API の説明画面（FastAPI が、自動で作るもの）。外には出さない。
# 中継しない（バックエンドには、届かない）。画面のファイルに、置き換わらないよう、はっきり 404 にする
location ~ ^/(docs|redoc|openapi\.json)(/|$) {
    return 404;
}

# /api で始まるお願いは、バックエンドへ渡す
location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# それ以外は、画面のファイルを返す。見つからない場所（画面の中の住所）は、index.html に戻す
location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
}
